<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高三英文｜課堂遊戲</title>
<style>
:root{--bg:#0f0f14;--panel:#1b1b24;--ink:#f5f3ee;--mute:#a9a6b5;--hot:#ff3d5a;--amp:#ffd23f;--line:#2c2c3a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 500px at 50% -10%,#3a0d1a 0%,transparent 60%),var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:34px;margin:0 0 4px}h1 span{color:var(--hot)}
.sub{color:var(--mute);margin:0 0 24px}
h2{font-size:20px;margin:28px 0 10px;display:flex;gap:10px;align-items:baseline}
h2 small{color:var(--mute);font-size:14px;font-weight:400}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lesson h3{margin:0 0 6px;font-size:16px;color:var(--amp)}
.lesson a{display:block;color:var(--ink);text-decoration:none;padding:10px 12px;border-radius:10px;background:#14141c;border:1px solid var(--line);margin-top:6px;font-size:17px}
.lesson a:hover{border-color:var(--hot)}
.lesson .none{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>高三英文 <span>課堂遊戲</span></h1>
<p class="sub">點選課次下方的遊戲開始玩。</p>
<div id="list"></div>
</div>
<script>
// 新增遊戲：在 GAMES 加一行。lessons 填這個遊戲涵蓋的課次。
const GAMES=[
  {book:"B5",lessons:[3,4],title:"L3–L4 單字片語挑戰（中英四選一）",path:"B5/L3-L4-words-phrases/"},
  {book:"B5",lessons:[3,4],title:"L3–L4 重點複習挑戰（25 個重點，中英四選一）",path:"B5/L3-L4-review-quiz/"},
  {book:"B5",lessons:[5],title:"B5L5-01 字彙盲盒（情境猜單字＋課本例句，共三關）",path:"B5/L5-01/"}
];
const BOOKS=[["B5","Book 5","高三上"],["B6","Book 6","高三下"]];
const list=document.getElementById("list");
BOOKS.forEach(([b,en,zh])=>{
  const h=document.createElement("h2");h.innerHTML=`${b} ${zh} <small>${en}</small>`;list.appendChild(h);
  for(let l=1;l<=6;l++){
    const box=document.createElement("div");box.className="lesson";
    const t=document.createElement("h3");t.textContent=`Lesson ${l}`;box.appendChild(t);
    const gs=GAMES.filter(g=>g.book===b&&g.lessons.includes(l));
    if(!gs.length){const n=document.createElement("div");n.className="none";n.textContent="尚無遊戲";box.appendChild(n);}
    gs.forEach(g=>{const a=document.createElement("a");a.href=g.path;a.textContent="▶ "+g.title;box.appendChild(a);});
    list.appendChild(box);}
});
</script>
</body>
</html>
