<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B5 L3–L4 配對消消樂</title>
<style>
:root{--bg:#0e0f1a;--panel:#1a1c2e;--ink:#f5f3ee;--mute:#a6a9c2;--hot:#ff3d8b;--cyan:#22d3ee;--amp:#ffd23f;--ok:#2ee59d;--no:#ff4d4d;--line:#2b2e48}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;justify-content:center;background:radial-gradient(900px 500px at 20% -10%,#3b1046 0%,transparent 60%),radial-gradient(900px 500px at 90% 0%,#0b3a4a 0%,transparent 55%),var(--bg)}
.wrap{width:100%;max-width:560px;padding:18px 14px 40px}
h1{font-size:30px;line-height:1.15;margin:8px 0 4px}h1 span{background:linear-gradient(90deg,var(--hot),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0 0 18px;font-size:15px;line-height:1.6}.sub a{color:var(--amp)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
input{width:100%;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#111324;color:var(--ink);outline:none}
input:focus{border-color:var(--cyan)}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{display:block;width:100%;margin-top:18px;padding:16px;font-size:20px;font-weight:800;border:0;border-radius:14px;background:linear-gradient(90deg,var(--hot),#ff6a3d);color:#fff;cursor:pointer;letter-spacing:1px;box-shadow:0 6px 0 #9e1450}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #9e1450}
.err{color:var(--no);font-size:14px;min-height:18px;margin-top:8px}
.rules{font-size:14px;color:var(--mute);line-height:1.7;margin:14px 0 0;padding-left:18px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.music{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:15px;cursor:pointer}
.score{font-size:15px;color:var(--amp)}
.stage{text-align:center;color:var(--mute);font-size:14px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{min-height:68px;border-radius:14px;border:2px solid var(--line);background:#14162a;color:var(--ink);font-size:18px;font-weight:700;padding:10px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;transition:transform .1s,border-color .15s,background .15s,opacity .3s}
.tile.en{font-family:system-ui,"Segoe UI",sans-serif;letter-spacing:.3px}
.tile.zh{font-size:16px;font-weight:600}
.tile:active{transform:scale(.97)}
.tile.sel{border-color:var(--cyan);background:#0f2c3a;box-shadow:0 0 0 3px rgba(34,211,238,.25)}
.tile.ok{border-color:var(--ok);background:#0f3b2b;transform:scale(1.04)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.6)}
.tile.no{border-color:var(--no);background:#401418;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:30px;margin-top:12px;font-size:19px;font-weight:800;text-align:center}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}.fb.combo{color:var(--amp)}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:var(--amp);text-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none;animation:pop 1s forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.cert{background:#fbf7ec;color:#1d1a14;border-radius:16px;padding:22px 20px;border:6px double #b8892b;position:relative}
.cert h2{text-align:center;margin:0;font-size:28px;letter-spacing:6px;color:#8a1c2b}
.cert .en{text-align:center;font-size:12px;letter-spacing:3px;color:#8a7a55;margin-bottom:12px}
.cert .who{text-align:center;font-size:22px;font-weight:800;margin:8px 0 2px}
.cert .meta{text-align:center;font-size:14px;color:#5b5444}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0 10px}
.stat{background:#fff;border:1px solid #e3d6b5;border-radius:12px;padding:10px;text-align:center}
.stat div{font-size:12px;color:#7a6f57}.stat strong{font-size:26px;font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:-10px;top:-14px;width:62px;height:62px;background:#fbf7ec;border-radius:50%;border:3px solid #c0283d;color:#c0283d;display:grid;place-items:center;font-weight:900;font-size:15px;transform:rotate(-14deg)}
.wrong{margin-top:10px;font-size:14px;color:#5b5444}.wrong li{margin:2px 0}
.tip{text-align:center;color:var(--amp);font-size:15px;margin:14px 0 0}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<section id="start">
  <h1>B5 L3–L4<br><span>配對消消樂</span></h1>
  <p class="sub">把英文和中文配成一對，配對成功就消掉！<br><a href="../../">← 回高三英文遊戲目錄</a></p>
  <div class="card">
    <div class="row">
      <div><label for="cls">班級</label><input id="cls" inputmode="numeric" placeholder="例：301"></div>
      <div><label for="seat">座號</label><input id="seat" inputmode="numeric" placeholder="例：18"></div>
    </div>
    <label for="nm">姓名</label><input id="nm" placeholder="你的名字">
    <div class="err" id="err"></div>
    <button class="btn" id="go">開始配對 ▶</button>
    <ul class="rules">
      <li>共 5 關，每關 5 組單字片語，全部 25 個都會出現。</li>
      <li>先點一張英文卡，再點它的中文卡（順序反過來也可以）。</li>
      <li>連續配對成功有連擊加分，配錯不扣分，但會降低正確率。</li>
    </ul>
  </div>
</section>
<section id="play" class="hidden">
  <div class="hud"><span class="pill" id="lvl">第 1 / 5 關</span><span class="pill" id="clock">00:00</span><span class="pill score" id="pts">0 分</span><button class="music" id="mus">🎵</button></div>
  <div class="stage" id="stage">配出 5 組就過關</div>
  <div class="grid" id="grid"></div>
  <div class="fb" id="fb"></div>
</section>
<section id="done" class="hidden">
  <div class="cert">
    <div class="stamp" id="stamp">完成</div>
    <h2>挑戰證書</h2>
    <div class="en">CERTIFICATE · B5 L3–L4 MATCH GAME</div>
    <div class="who" id="cWho"></div>
    <div class="meta">配對消消樂・25 個單字片語</div>
    <div class="stats">
      <div class="stat"><div>分數</div><strong id="sScore"></strong></div>
      <div class="stat"><div>正確率</div><strong id="sRate"></strong></div>
      <div class="stat"><div>配錯次數</div><strong id="sMiss"></strong></div>
      <div class="stat"><div>完成時間</div><strong id="sTime"></strong></div>
    </div>
    <div class="meta" id="cWhen"></div>
    <div class="wrong" id="wrong"></div>
  </div>
  <p class="tip">📸 請截圖這張證書，交給老師登記成績</p>
  <button class="btn" id="again">再玩一次 ↻</button>
</section>
</div>
<script>
/* ---------- audio ---------- */
let AC=null,master=null,musicOn=true,seqTimer=null,nextT=0,step=0;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);}return AC;}
let noiseBuf=null;function noise(){if(noiseBuf)return noiseBuf;const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return noiseBuf=b;}
const BPM=126,S16=60/BPM/4;
const N=n=>440*Math.pow(2,(n-69)/12);
// Am - F - C - G (每和弦一小節)
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];const BASS=[45,41,48,43];
let bus=null,delay=null;
function setup(){if(bus)return;bus=AC.createGain();bus.gain.value=1;const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;bus.connect(comp).connect(master);
 delay=AC.createDelay();delay.delayTime.value=S16*3;const fb=AC.createGain();fb.gain.value=.28;const dl=AC.createBiquadFilter();dl.type="lowpass";dl.frequency.value=2500;const wet=AC.createGain();wet.gain.value=.25;delay.connect(dl).connect(fb).connect(delay);dl.connect(wet).connect(bus);}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(45,t+.09);g.gain.setValueAtTime(.95,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g).connect(bus);o.start(t);o.stop(t+.3);}
function clap(t){[0,.012,.024].forEach(d=>{const s=AC.createBufferSource();s.buffer=noise();const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1600;f.Q.value=.8;const g=AC.createGain();g.gain.setValueAtTime(.32,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.12);s.connect(f).connect(g).connect(bus);s.start(t+d);s.stop(t+d+.15);});}
function hat(t,open){const s=AC.createBufferSource();s.buffer=noise();const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=8000;const g=AC.createGain();const len=open?.12:.03;g.gain.setValueAtTime(open?.12:.06,t);g.gain.exponentialRampToValueAtTime(.001,t+len);s.connect(f).connect(g).connect(bus);s.start(t);s.stop(t+len+.01);}
function bassNote(t,n){const o=AC.createOscillator();o.type="sawtooth";o.frequency.value=N(n);const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(220,t+.15);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.32,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+S16*1.8);o.connect(f).connect(g).connect(bus);o.start(t);o.stop(t+S16*2);}
function stab(t,ch){ch.forEach(n=>[-8,8].forEach(det=>{const o=AC.createOscillator();o.type="sawtooth";o.frequency.value=N(n+12);o.detune.value=det;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=1800;const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.035,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+S16*1.6);o.connect(f).connect(g);g.connect(bus);g.connect(delay);o.start(t);o.stop(t+S16*1.8);}));}
function pluck(t,n){const o=AC.createOscillator();o.type="triangle";o.frequency.value=N(n+24);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(bus);g.connect(delay);o.start(t);o.stop(t+.18);}
const ARP=[0,1,2,1,0,2,1,2];
function schedule(){setup();while(nextT<AC.currentTime+.15){const s=step%16,bar=Math.floor(step/16)%4,ch=CH[bar],intro=step<32;
 if(s%4===0)kick(nextT);
 if(!intro&&(s===4||s===12))clap(nextT);
 if(s%4===2)hat(nextT,true);else if(!intro&&s%2===1)hat(nextT,false);
 if(s%4===2)bassNote(nextT,BASS[bar]);
 if(s===2||s===6||s===10||s===14)stab(nextT,ch);
 if(!intro&&s%2===0)pluck(nextT,ch[ARP[(s/2)%8]]);
 nextT+=S16;step++;}}
function startMusic(){if(!musicOn)return;try{ac();if(AC.state==="suspended")AC.resume().catch(()=>{});if(seqTimer)return;nextT=AC.currentTime+.05;step=0;seqTimer=setInterval(()=>{try{schedule();}catch(e){stopMusic();}},40);}catch(e){musicOn=false;$("mus").textContent="🔇 音樂關";}}
function stopMusic(){clearInterval(seqTimer);seqTimer=null;}
function sfx(ok){try{ac();const t=AC.currentTime;const notes=ok?[659,880,1319]:[220,165];notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;g.gain.setValueAtTime(.25,t+i*.07);g.gain.exponentialRampToValueAtTime(.001,t+i*.07+.18);o.connect(g).connect(master);o.start(t+i*.07);o.stop(t+i*.07+.2);});}catch(e){}}
const ITEMS=[["artificial","人造的；人工的"],["victory","勝利"],["associate","聯想；把⋯⋯聯繫在一起"],["reputation","名聲；名譽"],["respectively","分別地；各自地"],["mystery","謎團；神祕的事物"],["magical","有魔力的；神奇的"],["various","各種的；各式各樣的"],["conquer","擊敗；征服"],["distant","遙遠的"],["nightmare","夢魘；惡夢"],["resource","資源"],["factor","因素"],["pollution","汙染"],["discover","發現"],["overnight","突然；一夜之間"],["evidence","證據"],["competitor","競爭者"],["relevant","相關的"],["ancient","古代的"],["be traced back to","追溯至⋯⋯"],["pass sth. on (to sb.)","傳遞（某物給某人）"],["look through","瀏覽"],["result from","起因於"],["a thing of the past","過時的事物；歷史"]];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
let rounds=[],ri=0,left=0,sel=null,lock=false,score=0,combo=0,hits=0,tries=0,miss=0,missed=new Map(),t0=0,tick=null,player={};
function fmt(s){const m=Math.floor(s/60),x=Math.floor(s%60);return String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function show(id){["start","play","done"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0);}
function pop(t){const d=document.createElement("div");d.className="pop";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
$("go").onclick=()=>{const cls=$("cls").value.trim(),seat=$("seat").value.trim(),nm=$("nm").value.trim();
 if(!cls||!seat||!nm){$("err").textContent="請填好班級、座號和姓名";return;}$("err").textContent="";
 player={cls,seat,nm};try{localStorage.setItem("b5l34",JSON.stringify(player));}catch(e){}
 try{startMusic();}catch(e){}begin();};
try{const s=JSON.parse(localStorage.getItem("b5l34")||"null");if(s){$("cls").value=s.cls;$("seat").value=s.seat;$("nm").value=s.nm;}}catch(e){}
function begin(){const all=shuffle(ITEMS);rounds=[];for(let i=0;i<all.length;i+=5)rounds.push(all.slice(i,i+5));
 ri=0;score=0;combo=0;hits=0;tries=0;miss=0;missed=new Map();t0=performance.now();clearInterval(tick);
 tick=setInterval(()=>{$("clock").textContent=fmt((performance.now()-t0)/1000);},250);$("pts").textContent="0 分";show("play");deal();}
function deal(){const r=rounds[ri];left=r.length;sel=null;lock=false;$("lvl").textContent=`第 ${ri+1} / ${rounds.length} 關`;
 $("stage").textContent="先點英文，再點對應的中文";$("fb").textContent="";$("fb").className="fb";
 const cards=shuffle(r.flatMap((it,k)=>[{k,side:"en",text:it[0],it},{k,side:"zh",text:it[1],it}]));
 const g=$("grid");g.innerHTML="";cards.forEach(c=>{const b=document.createElement("button");b.className="tile "+c.side;b.textContent=c.text;b._c=c;b.onclick=()=>tap(b);g.appendChild(b);});}
function tap(b){if(lock||b.classList.contains("gone"))return;
 if(!sel){sel=b;b.classList.add("sel");return;}
 if(sel===b){b.classList.remove("sel");sel=null;return;}
 const a=sel,c1=a._c,c2=b._c;
 if(c1.side===c2.side){a.classList.remove("sel");sel=b;b.classList.add("sel");return;}
 tries++;sel=null;
 if(c1.k===c2.k){hits++;combo++;const gain=100+(combo>1?(combo-1)*20:0);score+=gain;$("pts").textContent=score+" 分";
  a.classList.remove("sel");a.classList.add("ok");b.classList.add("ok");sfx(true);
  $("fb").textContent=combo>=3?`🔥 ${combo} 連擊！ +${gain}`:`配對成功！ +${gain}`;$("fb").className=combo>=3?"fb combo":"fb ok";
  if(combo===5||combo===10||combo===15)pop(`${combo} COMBO!`);
  setTimeout(()=>{a.classList.add("gone");b.classList.add("gone");},350);
  left--;if(left===0){lock=true;setTimeout(next,700);}}
 else{miss++;combo=0;lock=true;a.classList.remove("sel");a.classList.add("no");b.classList.add("no");sfx(false);
  const en=c1.side==="en"?c1.it:c2.it;missed.set(en[0],en);
  $("fb").textContent=`配錯了：${en[0]} ＝ ${en[1]}`;$("fb").className="fb no";
  setTimeout(()=>{a.classList.remove("no");b.classList.remove("no");lock=false;},600);}}
function next(){ri++;if(ri<rounds.length){pop(`第 ${ri+1} 關`);deal();}else finish();}
function finish(){clearInterval(tick);const sec=(performance.now()-t0)/1000;const rate=tries?Math.round(hits/tries*100):0;
 $("cWho").textContent=`${player.cls} 班　${player.seat} 號　${player.nm}`;
 $("sScore").textContent=score;$("sRate").textContent=rate+"%";$("sMiss").textContent=miss;$("sTime").textContent=fmt(sec);
 const d=new Date();$("cWhen").textContent="完成於："+d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
 $("stamp").textContent=rate===100?"全對":rate>=80?"過關":"再加油";
 const list=[...missed.values()];
 $("wrong").innerHTML=list.length?"<b>要再複習：</b><ul>"+list.map(x=>`<li>${x[0]}　${x[1]}</li>`).join("")+"</ul>":"<div style='text-align:center'>一次都沒配錯，太厲害了！</div>";
 show("done");}
$("again").onclick=()=>{try{startMusic();}catch(e){}begin();};
$("mus").onclick=()=>{musicOn=!musicOn;$("mus").textContent=musicOn?"🎵":"🔇";musicOn?startMusic():stopMusic();};
</script>
</body>
</html>
